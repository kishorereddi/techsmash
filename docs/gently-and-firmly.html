<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gently and Firmly</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1b1b1b;
      font-family: 'Segoe UI', sans-serif;
    }

    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: #002050;
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }

    .toolbar span { font-size: 0.9rem; opacity: 0.85; }

    .toolbar a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .toolbar a:hover { text-decoration: underline; }

    iframe {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 44px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>Gently and Firmly</span>
    <a href="gently-and-firmly.pdf" download>Download PDF</a>
  </div>
  <iframe src="gently-and-firmly.pdf#toolbar=1&view=FitH&scrollbar=1" title="Gently and Firmly PDF"></iframe>
</body>
</html>
