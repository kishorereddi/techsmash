<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gently and Firmly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1b1b1b; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    .toolbar {
      background: #002050;
      color: #fff;
      padding: 12px 24px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .toolbar span { opacity: 0.85; }
    .toolbar a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .toolbar a:hover { text-decoration: underline; }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>Gently and Firmly</span>
    <a href="gently-and-firmly.pdf" download>Download PDF</a>
  </div>
  <iframe src="gently-and-firmly.pdf" title="Gently and Firmly PDF"></iframe>
</body>
</html>
